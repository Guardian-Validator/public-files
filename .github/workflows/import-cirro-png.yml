name: import-cirro-png
on:
  push:
    branches: [full-bleed-cirro-icon]
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render full-bleed Cirro PNGs and remove this workflow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 cirro-ring.svg -o cr.png
          cp cr.png cirro-ring.png
          python3 - <<'PY'
          from pathlib import Path
          data = Path('cr.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', data[:16]
          assert len(data) > 10000, len(data)
          print('wrote', len(data), 'bytes')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cr.png cirro-ring.png
          git rm -f .github/workflows/import-cirro-png.yml
          git commit -m "Replace padded Cirro PNGs with a full-bleed 512x512 render."
          git push
