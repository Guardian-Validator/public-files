name: import-cirro-png
on:
  push:
    branches: [full-bleed-cirro-icon]
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import full-bleed Cirro PNGs and remove this workflow
        run: |
          set -euo pipefail
          curl -fsSL -o cr.png "https://raw.githubusercontent.com/Guardian-Validator/sudo-frens-sfdp-bot/a843e91c963637dd00815eb6e5dab44bfe274110/site/public/brand/cirro.png"
          python3 - <<'PY'
          from pathlib import Path
          data = Path('cr.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', data[:16]
          assert len(data) > 40000
          PY
          cp cr.png cirro-ring.png
          rm -f .github/workflows/import-cirro-png.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cr.png cirro-ring.png
          git rm -f .github/workflows/import-cirro-png.yml
          git commit -m "Replace padded Cirro PNGs with a full-bleed 512x512 render."
          git push
